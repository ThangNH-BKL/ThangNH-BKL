[CameraFtpSync]
Folder=D:\CameraData
Host=ftp.company.local
Username=ftp_user
RemoteRoot=/production/camera
StationID=PC01
Include=lsc*.txt
Exclude=*.tmp;*.part;.*
Security=ExplicitFTPS
Verification=ReadBackSHA256
Credential=CameraFtpSync/default
Port=21
IntervalMinutes=5
StableSeconds=30
RetryAttempts=5
ConnectTimeout=15
TransferTimeout=600
BackupCount=3
BackupDays=7
Recursive=false
SeparateByStation=true
RememberPassword=false
PlainConsent=false
ExclusiveOwnerConsent=false
AllowEmpty=false
Passive=true
AutoStart=false
StartWindows=false
Retention=false
GapConsent=false
